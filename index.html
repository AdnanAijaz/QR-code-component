<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    * {
      margin: 0;
      padding: 0;

      font-family: "Outfit", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }


    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      position: absolute;
      width: 100%;
      bottom: 0px;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    body {
      background-color: hsl(212, 45%, 89%);
      display: flex;
      height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {


      background-color: #fff;
      width: 200px;

      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .qr img {
      width: 200px;
      height: 200px;
      border-radius: 10px;
    }
    .bold-text{
      margin-bottom: 5px;
    }
    .bold-text p{
      font-weight: 700;
      color:hsl(218, 44%, 22%);
    }
    .text{
      padding: 10px 15px;
    }
    p {
      font-size: 15px;
      text-align: center;
    }
    .directions p{
      font-size: 12px;
      color: hsl(216, 15%, 48%);
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="qr">
      <img src="images/image-qr-code.png" alt="qrcode">
    </div>
    <div class="text">
    <div class="bold-text">
      <p>Improve your frontend skills by building projects</p>
    </div>
    <div class="directions">
      <p>Scan the QR code to visit Frontend Mentor and take your coding skills to next level</p>
    </div>
    </div>
  </div>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Codify</a>.
  </footer>
</body>

</html>
